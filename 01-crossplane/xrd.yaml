# =====================================================================
# Crossplane XRD — CompositeResourceDefinition
# =====================================================================
# Define la API XPostgreSQLInstance (Composite Resource) y su Claim
# asociado PostgreSQLInstance, en el grupo database.poc.io/v1alpha1.
# =====================================================================

apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xpostgresqlinstances.database.poc.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  group: database.poc.io
  names:
    kind: XPostgreSQLInstance
    plural: xpostgresqlinstances
  claimNames:
    kind: PostgreSQLInstance
    plural: postgresqlinstances
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  description: Parámetros configurables por el equipo de desarrollo.
                  properties:
                    dbName:
                      type: string
                      description: Nombre de la base de datos PostgreSQL a crear.
                    owner:
                      type: string
                      description: Rol/usuario propietario de la base de datos.
                  required:
                    - dbName
                    - owner
              required:
                - parameters
